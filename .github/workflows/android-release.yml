name: Build & Release SnoozeShield Android APK (Obtainium Ready)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_app

    steps:
      - name: Checkout SnoozeShield Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle & Android Build Environment
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Installable Signed Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare Clean APK Filename for Obtainium
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ../snoozeshield-alarm-v1.0.${{ github.run_number }}.apk

      - name: Create GitHub Release for Obtainium Auto-Updates
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "SnoozeShield Alarm v1.0.${{ github.run_number }}"
          body: |
            Automated Android APK build for **Obtainium** (`snoozeshield-alarm-v1.0.${{ github.run_number }}.apk`).
            - Includes ML Kit Barcode Scanner, 6-Digit PC Challenge Sync, Full-Screen Intent Lockscreen Wake, `OnBackPressedCallback`, and 100% `STREAM_ALARM` Volume Enforcer.
          files: snoozeshield-alarm-v1.0.${{ github.run_number }}.apk
          draft: false
          prerelease: false
